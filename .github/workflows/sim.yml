name: simulation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fast verification run (reduced trials + ablation, incl. sklearn baselines)
        run: python cadt_proper_simulation.py --seed 42 --trials 50 --ablate --no-plots
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sim-outputs
          path: |
            energy_data.csv
            trust_data.csv
            hs_sweep.csv
            run_manifest.json
      - name: Show result summary
        run: python -c "import json; print(json.dumps(json.load(open('run_manifest.json'))['results'], indent=1))"
